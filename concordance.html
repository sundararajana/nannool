<!DOCTYPE html>

<html lang="ta">
<head>
<meta charset="UTF-8">
<title>நன்னூல் தொடரடைவு (concordance)</title>

<link rel="stylesheet" href="common.css">

<style>
    body, html {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
    }

    button {
        margin: 0.2rem;
        padding: 0.35rem 0.6rem;
        cursor: pointer;
    }

    button.active {
        font-weight: bold;
    }

    .word {
        display: block;
        margin: 0.15rem 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        text-align: left;
        cursor: pointer;
    }

    #words {
        column-width: 14rem;
        column-gap: 3rem;
    }

    .word {
        break-inside: avoid;
    }

    .word-count {
        color: #666;
        margin-left: 0.5rem;
    }

    .occurrence {
        padding: 0.8rem 0;
        border-bottom: 1px solid #ddd;
    }

    .location {
        margin-bottom: 0.4rem;
        font-size: 0.9rem;
        color: #555;
    }

    .global-number {
        font-weight: bold;
        margin-right: 0.3rem;
    }

    .kwic {
        margin: 0.5rem 0;
        font-family: serif;
        font-size: 1.05rem;
    }

    .kwic mark {
        background: #fff3a3;
        font-weight: bold;
    }

    .text {
        font-family: serif;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>

</head>

<body>

<h1>நன்னூல் தொடரடைவு (concordance)</h1>

<div>
    <span><strong><a class="external-link" href="index.html" target="NannoolMainPage">நன்னூல் உரை தேடி 🔙</a></strong></span>
</div>

<div id="stats"></div>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search concordance by word" autocomplete="off" />
    <div id="loadingStatus">Initializing model and loading embeddings...</div>
    <ul id="resultsList" class="results-list" style="display: none;"></ul>
</div>

<style>
    .search-container { font-family: sans-serif; max-width: 500px; margin: 20px auto; }
    #searchInput { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    #loadingStatus { font-size: 13px; color: #666; margin-top: 5px; }
    .results-list { list-style: none; padding: 0; margin: 5px 0 0 0; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    .results-list li { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; }
    .results-list li:last-child { border-bottom: none; }
    .results-list li:hover { background-color: #f5f5f5; }
    .score { color: #888; font-size: 12px; }
</style>


<div id="initials"></div>

<hr>

<div id="words"></div>

<hr>

<div id="occurrences"></div>

<script src="mobile_detect.js"></script>

<script>

window.name = "NannoolConcordancePage";

const tamilOrder = [
    "அ", "ஆ", "இ", "ஈ", "உ", "ஊ", "எ", "ஏ", "ஐ",
    "ஒ", "ஓ", "ஔ",
    "க", "ங", "ச", "ஞ", "ட", "ண", "த", "ந",
    "ப", "ம", "ய", "ர", "ல", "வ", "ழ", "ள", "ற", "ன"
];

const URAI_PAGE_BASE = "index.html?song_no=";

let nurpas = [];
let concordance = {};

fetch("concordance.json")
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to load concordance.json");
        }
        return response.json();
    })
    .then(data => {
        nurpas = data.nurpas;
        concordance = data.concordance;

        const wordCount = Object.keys(concordance).length;
        const occurrenceCount =
            Object.values(concordance)
                .reduce((sum, occurrences) => sum + occurrences.length, 0);

        document.getElementById("stats").textContent =
            `${wordCount} சொற்கள் · ${occurrenceCount} occurrences`;

        showInitials();

        // Check for the URL parameter for word to link
        const urlParams = new URLSearchParams(window.location.search);
        const wordParam = urlParams.get("word");
        if (wordParam) {
            try {
                const firstLetter = wordParam.charAt(0);
                showWords(firstLetter);
                showOccurrences(decodeURIComponent(wordParam));
            } catch (e) {
                console.log(e.stack);
            }
        }
    })
    .catch(error => {
        console.error(error);
        document.getElementById("stats").textContent =
            "தொடரடைவுத் தரவை பதிவிறக்க முடியவில்லை.";
    });


function getNurpaText(global_nurpa) {
    return nurpas[global_nurpa - 1];
}


function showInitials() {
    const container = document.getElementById("initials");
    container.innerHTML = "";

    for (const initial of tamilOrder) {
        const button = document.createElement("button");
        button.textContent = initial;

        button.onclick = () => {
            showWords(initial);
            document.getElementById("occurrences").innerHTML = "";
        };

        container.appendChild(button);
    }
}


function showWords(initial) {
    const container = document.getElementById("words");
    container.innerHTML = "";

    const words = Object.keys(concordance)
        .filter(word => word.startsWith(initial))
        .sort((a, b) => a.localeCompare(b, "ta"));

    for (const word of words) {
        const button = document.createElement("button");
        button.className = "word";

        button.innerHTML =
            `${escapeHtml(word)} <span class="word-count">(${concordance[word].length})</span>`;

        button.onclick = () => {
            showOccurrences(word);
        };

        container.appendChild(button);
    }
}


function showOccurrences(word) {
    const container = document.getElementById("occurrences");
    container.innerHTML = "";

    const occurrences = concordance[word];

    for (const occurrence of occurrences) {
        const div = document.createElement("div");
        div.className = "occurrence";

        const link = document.createElement("a");

        link.href =
            URAI_PAGE_BASE +
            encodeURIComponent(occurrence.global_nurpa);

        link.target = isMobile ? "_blank" : "NannoolMainPage";

        const location = document.createElement("div");
        location.className = "location";

        location.innerHTML =
            `<span class="global-number" style="color: var(--primary);">${escapeHtml(occurrence.global_nurpa)}</span>` +
            ` · ${escapeHtml(occurrence.adhikaaram)}` +
            ` · ${escapeHtml(occurrence.iyal_name)}` +
            ` · ${escapeHtml(occurrence.title)}`;

        link.appendChild(location);

        const kwic = document.createElement("div");
        kwic.className = "kwic";

        kwic.innerHTML = makeKwic(
            getNurpaText(occurrence.global_nurpa),
            word,
            occurrence.nurpa_position
        );

        link.appendChild(kwic);

        div.appendChild(link);
        container.appendChild(div);
    }

    document.getElementById("occurrences").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


function makeKwic(text, word, position) {
    if (typeof text !== "string") {
        return "";
    }

    if (!Number.isInteger(position)) {
        return escapeHtml(text);
    }

    const words = tokenize(text);

    if (position < 0 || position >= words.length) {
        return escapeHtml(text);
    }

    const context = 5;

    const start = Math.max(0, position - context);
    const end = Math.min(words.length, position + context + 1);

    const before = words.slice(start, position).join(" ");
    const matched = words[position];
    const after = words.slice(position + 1, end).join(" ");

    return (
        `${start > 0 ? "... " : ""}` +
        `${escapeHtml(before)} ` +
        `<mark>${escapeHtml(matched)}</mark>` +
        `${after ? " " + escapeHtml(after) : ""}` +
        `${end < words.length ? " ..." : ""}`
    );
}


function tokenize(text) {
    return text.normalize("NFC")
        .match(/[\u0B80-\u0BFF]+/g) || [];
}


function escapeHtml(text) {
    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

</script>

<script type="module">

// code for semantic search of words

import { pipeline } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

class ConcordanceSemanticSearch {
    constructor() {
        this.extractor = null;
        this.embeddingsData = null;
        this.isInitialized = false;
    }

    async init(gzUrl = 'word_embeddings.json.gz', statusElementId = 'loadingStatus') {
        const statusEl = document.getElementById(statusElementId);

        try {
            // 1. Load the model and fetch the .gz file concurrently
            if (statusEl) statusEl.textContent = "Loading model and fetching compressed embeddings...";

            const [extractor, response] = await Promise.all([
                pipeline('feature-extraction', 'Xenova/multilingual-e5-small'),
                fetch(gzUrl)
            ]);

            this.extractor = extractor;

            console.log("done download");

            if (!response.ok) throw new Error(`Failed to fetch ${gzUrl}: ${response.statusText}`);

            // 2. Decompress the .gz stream on the fly using browser native DecompressionStream
            if (statusEl) statusEl.textContent = "Decompressing embeddings...";
            const decompressedStream = response.body.pipeThrough(new DecompressionStream('gzip'));
            const jsonText = await new Response(decompressedStream).text();

            // 3. Parse JSON data
            this.embeddingsData = JSON.parse(jsonText);

            this.isInitialized = true;

            if (statusEl) {
                statusEl.textContent = `Ready! Loaded ${this.embeddingsData.length} concordance terms.`;
                setTimeout(() => statusEl.style.display = 'none', 3000); // Hide status after 3s
            }
        } catch (error) {
            console.error("Initialization error:", error);
            if (statusEl) statusEl.textContent = "Error loading search engine. Check console.";
        }
    }

    async search(rawQuery, topK = 5) {
        if (!this.isInitialized || !rawQuery.trim()) return [];

        // E5 model requirement: prefix search query with "query: "
        const queryText = `query: ${rawQuery.trim()}`;

        // Generate query embedding vector
        const output = await this.extractor(queryText, { pooling: 'mean', normalize: true });
        const queryVec = output.data; // Float32Array

        // Compute cosine similarity (dot product since vectors are normalized)
        const scores = this.embeddingsData.map(item => {
            const wordVec = item.embedding;
            let dotProduct = 0;

            for (let i = 0; i < wordVec.length; i++) {
                dotProduct += wordVec[i] * queryVec[i];
            }

            return { word: item.word, score: dotProduct };
        });

        // Sort descending and slice top results
        scores.sort((a, b) => b.score - a.score);
        return scores.slice(0, topK);
    }
}

// --- Wire up UI with Debounce ---
document.addEventListener('DOMContentLoaded', async () => {
    const searchEngine = new ConcordanceSemanticSearch();
    await searchEngine.init('word_embeddings.json.gz');

    const inputEl = document.getElementById('searchInput');
    const resultsListEl = document.getElementById('resultsList');

    let debounceTimer;

    inputEl.addEventListener('input', (e) => {
        const query = e.target.value;

        clearTimeout(debounceTimer);

        if (!query.trim()) {
            resultsListEl.style.display = 'none';
            resultsListEl.innerHTML = '';
            return;
        }

        // 250ms debounce so it doesn't trigger computation on every single keystroke instantly
        debounceTimer = setTimeout(async () => {
            const results = await searchEngine.search(query);

            if (results.length === 0) {
                resultsListEl.style.display = 'none';
                return;
            }

            // Render top 5 clickable list items
            resultsListEl.innerHTML = results.map(res => `
                <li data-word="${res.word}">
                    <span>${res.word}</span>
                    <span class="score">${(res.score * 100).toFixed(1)}% match</span>
                </li>
            `).join('');

            resultsListEl.style.display = 'block';

            // Hook up click handler to show words and occurences
            resultsListEl.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', () => {
                    const selectedWord = li.getAttribute('data-word');
                    inputEl.value = selectedWord;
                    resultsListEl.style.display = 'none';

                    const firstLetter = selectedWord.charAt(0);
                    showWords(firstLetter);
                    showOccurrences(selectedWord);
                });
            });
        }, 250);
    });

    // Hide dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) {
            resultsListEl.style.display = 'none';
        }
    });
});

</script>

</body>
</html>
